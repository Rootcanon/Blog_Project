{% extends 'blog/base.html' %}

{% block title %}
  {{ post.title }}
{% endblock %}

{% block content %}
  <article>
    <h1>{{ post.title }}</h1>
    <div class="post-meta">
      {{ post.published_at|date:'M d, Y' }} {{ post.author }}
      {% if post.category %}
        <a href="#">{{ post.category.name }}</a>
      {% endif %}
    </div>
    <div>{{ post.content|linebreaks }}</div>
  </article>
{% endblock %}
